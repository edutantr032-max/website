```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Interactive E-Commerce</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f5f7fb;
color:#222;
}

header{
background:#0f172a;
color:#fff;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:30px;
font-weight:700;
color:#38bdf8;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
text-decoration:none;
color:#fff;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#38bdf8;
}

.icons{
display:flex;
align-items:center;
gap:20px;
font-size:22px;
cursor:pointer;
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:70px 8%;
background:linear-gradient(135deg,#2563eb,#9333ea);
color:white;
flex-wrap:wrap;
}

.hero-text{
max-width:550px;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
margin-bottom:30px;
}

.hero button{
padding:15px 40px;
border:none;
border-radius:10px;
background:white;
color:#2563eb;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

.hero button:hover{
transform:scale(1.05);
}

.hero img{
width:420px;
max-width:100%;
border-radius:20px;
}

.search{
padding:30px 8%;
display:flex;
justify-content:center;
}

.search input{
width:450px;
padding:14px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

.title{
text-align:center;
margin-top:20px;
font-size:35px;
}

.products{
padding:40px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card h3{
margin-bottom:10px;
}

.price{
font-size:22px;
color:#2563eb;
margin-bottom:10px;
font-weight:bold;
}

.rating{
color:orange;
margin-bottom:15px;
}

.buttons{
display:flex;
justify-content:space-between;
}

button{
cursor:pointer;
}

.cart-btn{
padding:10px 15px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
}

.wish-btn{
padding:10px 15px;
border:none;
background:#ef4444;
color:white;
border-radius:8px;
}

footer{
margin-top:60px;
background:#0f172a;
color:white;
text-align:center;
padding:30px;
}

.cart{
position:fixed;
top:0;
right:-380px;
width:350px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
transition:.4s;
padding:20px;
overflow:auto;
z-index:999;
}

.cart.active{
right:0;
}

.cart h2{
margin-bottom:20px;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:15px 0;
}

.total{
margin-top:25px;
font-size:22px;
font-weight:bold;
}

.checkout{
margin-top:20px;
width:100%;
padding:15px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
font-size:18px;
}

.close{
float:right;
cursor:pointer;
font-size:25px;
color:red;
}

@media(max-width:768px){

.hero{
text-align:center;
justify-content:center;
}

.hero h1{
font-size:40px;
}

nav{
display:none;
}

.search input{
width:100%;
}

}

</style>

</head>

<body>

<header>

<div class="logo">ShopEase</div>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Offers</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<div class="icons">
🔍
🛒 <span id="count">0</span>
</div>

</header>

<section class="hero">

<div class="hero-text">
<h1>Summer Mega Sale</h1>
<p>Discover amazing products with discounts up to 70%.</p>
<button>Shop Now</button>
</div>

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800" alt="">

</section>

<div class="search">
<input type="text" placeholder="Search products..." id="search">
</div>

<h2 class="title">Featured Products</h2>

<section class="products" id="products">

</section>

<div class="cart" id="cart">

<div class="close" onclick="closeCart()">✖</div>

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total : $<span id="total">0</span>
</div>

<button class="checkout">
Checkout
</button>

</div>

<footer>

<h2>ShopEase</h2>

<p>© 2026 All Rights Reserved.</p>

</footer>

<script>

const products=[
{
name:"Wireless Headphone",
price:99,
image:"https://picsum.photos/300?1"
},
{
name:"Gaming Mouse",
price:49,
image:"https://picsum.photos/300?2"
},
{
name:"Laptop",
price:899,
image:"https://picsum.photos/300?3"
},
{
name:"Smart Watch",
price:149,
image:"https://picsum.photos/300?4"
},
{
name:"Camera",
price:399,
image:"https://picsum.photos/300?5"
},
{
name:"Bluetooth Speaker",
price:89,
image:"https://picsum.photos/300?6"
},
{
name:"Sneakers",
price:79,
image:"https://picsum.photos/300?7"
},
{
name:"Keyboard",
price:65,
image:"https://picsum.photos/300?8"
}
];

let cart=[];

const container=document.getElementById("products");

function showProducts(data){

container.innerHTML="";

data.forEach((item)=>{

container.innerHTML+=`

<div class="card">

<img src="${item.image}">

<div class="card-content">

<h3>${item.name}</h3>

<div class="price">$${item.price}</div>

<div class="rating">★★★★★</div>

<div class="buttons">

<button class="cart-btn" onclick='addCart("${item.name}",${item.price})'>
Add Cart
</button>

<button class="wish-btn">
❤
</button>

</div>

</div>

</div>

`;

});

}

showProducts(products);

function addCart(name,price){

cart.push({name,price});

updateCart();

}

function updateCart(){

document.getElementById("count").innerHTML=cart.length;

let html="";

let total=0;

cart.forEach(item=>{

total+=item.price;

html+=`
<div class="cart-item">
<span>${item.name}</span>
<span>$${item.price}</span>
</div>
`;

});

document.getElementById("cartItems").innerHTML=html;

document.getElementById("total").innerHTML=total;

document.getElementById("cart").classList.add("active");

}

function closeCart(){

document.getElementById("cart").classList.remove("active");

}

document.getElementById("search").addEventListener("keyup",function(){

let text=this.value.toLowerCase();

let filtered=products.filter(p=>p.name.toLowerCase().includes(text));

showProducts(filtered);

});

document.querySelector(".icons").onclick=function(){

document.getElementById("cart").classList.add("active");

}

</script>

</body>
</html>
```
